
{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daedalus Gestio - Acesso</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] min-h-screen flex items-center justify-center p-4 font-sans text-slate-300">
    
    <div class="max-w-md w-full bg-[#1e293b] rounded-2xl shadow-2xl border border-[#334155] p-8 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-900 via-cyan-400 to-cyan-900"></div>

        <div class="text-center mb-8 mt-2">
            <div class="w-16 h-16 bg-cyan-900/30 rounded-xl border border-cyan-700/50 mx-auto flex items-center justify-center mb-4 shadow-[0_0_15px_rgba(6,182,212,0.1)]">
                <svg class="w-8 h-8 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">Daedalus <span class="text-cyan-500">Gestio</span></h1>
            <p class="text-[10px] text-slate-500 font-bold uppercase mt-2 tracking-widest">Acesso Restrito ao Laboratório</p>
        </div>

        <form id="form-login" class="space-y-5">
            <p id="msg-erro" class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs text-center p-3 rounded-lg font-medium"></p>

            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Matrícula (Login)</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </div>
                    <input type="number" id="login" required placeholder="Digite seu número de matrícula" class="w-full bg-[#0f172a] border border-[#334155] rounded-lg pl-10 pr-3 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Senha</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </div>
                    <input type="password" id="senha" required placeholder="••••••••" class="w-full bg-[#0f172a] border border-[#334155] rounded-lg pl-10 pr-3 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">
                </div>
            </div>

            <button type="submit" id="btn-entrar" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-4 rounded-lg transition-colors uppercase tracking-widest text-xs mt-6 shadow-lg shadow-cyan-900/20 border border-cyan-500">
                Acessar Sistema
            </button>
        </form>
    </div>
    
    <script src="{% static 'Daedalus/Login/login.js' %}"></script>
</body>
</html>
