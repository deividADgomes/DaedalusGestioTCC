{% extends 'Daedalus/Base.html' %}
{% load static %}

{% block title %}Daedalus Gestio - Dashboard{% endblock %}

{% block header %}
<div>
    <h1 class="text-xl md:text-2xl font-bold text-white">Dashboard</h1>
    <p class="text-xs text-cyan-500 font-medium tracking-wide uppercase mt-1">Indicadores, tendências e insights</p>
</div>
{% endblock %}

{% block content %}
<div class="flex-1 overflow-y-auto p-4 md:p-8" id="area-dashboard">
    <div class="max-w-[1500px] mx-auto w-full flex flex-col gap-5 pb-12">

        <!-- Filtros globais (valem para todas as visões e ficam no endereço da página) -->
        <section class="bg-[#1e293b] border border-[#334155] rounded-xl p-4" aria-label="Filtros">
            <div class="flex flex-wrap items-center gap-2" id="presets">
                <button type="button" data-preset="hoje" class="preset px-3 py-1.5 rounded-full text-xs font-semibold border border-[#334155] text-slate-400 hover:text-white">Hoje</button>
                <button type="button" data-preset="7" class="preset px-3 py-1.5 rounded-full text-xs font-semibold border border-[#334155] text-slate-400 hover:text-white">7 dias</button>
                <button type="button" data-preset="30" class="preset px-3 py-1.5 rounded-full text-xs font-semibold border border-[#334155] text-slate-400 hover:text-white">30 dias</button>
                <button type="button" data-preset="mes" class="preset px-3 py-1.5 rounded-full text-xs font-semibold border border-[#334155] text-slate-400 hover:text-white">Mês atual</button>
                <button type="button" data-preset="trimestre" class="preset px-3 py-1.5 rounded-full text-xs font-semibold border border-[#334155] text-slate-400 hover:text-white">Trimestre</button>
                <button type="button" data-preset="6m" class="preset px-3 py-1.5 rounded-full text-xs font-semibold border border-[#334155] text-slate-400 hover:text-white" title="Últimos 6 meses">Semestral (6 meses)</button>
                <button type="button" data-preset="12m" class="preset px-3 py-1.5 rounded-full text-xs font-semibold border border-[#334155] text-slate-400 hover:text-white" title="Últimos 12 meses">Anual (12 meses)</button>
                <button type="button" data-preset="semestre" class="preset px-3 py-1.5 rounded-full text-xs font-semibold border border-[#334155] text-slate-400 hover:text-white" title="Do início do semestre até hoje">Semestre atual</button>
                <button type="button" data-preset="ano" class="preset px-3 py-1.5 rounded-full text-xs font-semibold border border-[#334155] text-slate-400 hover:text-white" title="De 1º de janeiro até hoje">Ano atual</button>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-7 gap-3 mt-3">
                <label class="flt">Início<input type="date" id="f-inicio"></label>
                <label class="flt">Fim<input type="date" id="f-fim"></label>
                <label class="flt">UF<select id="f-uf"><option value="">Todas</option></select></label>
                <label class="flt">Analista<select id="f-analista"><option value="">Todos</option></select></label>
                <label class="flt">Modelo<select id="f-modelo"><option value="">Todos</option></select></label>
                <label class="flt">Cliente<select id="f-cliente"><option value="">Todos</option></select></label>
                <label class="flt">Técnico<select id="f-tecnico"><option value="">Todos</option></select></label>
                <label class="flt">Comparar com<select id="f-comparar"><option value="anterior">Período anterior</option><option value="ano">Mesmo período do ano anterior</option></select></label>
            </div>
            <div class="flex flex-wrap items-center gap-x-4 gap-y-2 mt-3 text-xs text-slate-400">
                <label class="inline-flex items-center gap-2"><input type="checkbox" id="f-historico" class="accent-cyan-500"> Incluir triagens antigas (sem data)</label>
                <span id="texto-periodo"></span>
                <div class="ml-auto flex flex-wrap gap-2">
                    <button type="button" id="btn-limpar" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold">Limpar filtros</button>
                    <button type="button" id="btn-atualizar" class="hidden px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold">Atualizar agora</button>
                    <button type="button" id="btn-tv" class="px-3 py-1.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-semibold">Modo TV</button>
                </div>
            </div>
            <div id="chips-filtros" class="flex flex-wrap gap-2 mt-3 empty:hidden"></div>
        </section>

        <nav id="abas" role="tablist" aria-label="Visões do dashboard" class="flex flex-wrap gap-2">
            <button type="button" role="tab" data-aba="executiva" class="aba">Executiva</button>
            <button type="button" role="tab" data-aba="operacao" class="aba">Operação e SLA</button>
            <button type="button" role="tab" data-aba="qualidade" class="aba">Qualidade</button>
            <button type="button" role="tab" data-aba="comercial" class="aba">Comercial</button>
            <button type="button" role="tab" data-aba="pecas" class="aba">Peças e custos</button>
            <button type="button" role="tab" data-aba="insights" class="aba">Insights <span id="badge-insights" class="hidden ml-1 px-1.5 py-0.5 rounded-full bg-rose-500 text-white text-[10px]"></span></button>
        </nav>

        <div id="painel-bi" role="tabpanel" aria-live="polite" aria-busy="false"></div>
    </div>
</div>
<style>
    .flt { display:flex; flex-direction:column; gap:.25rem; font-size:.625rem; font-weight:700; color:#94a3b8; text-transform:uppercase; letter-spacing:.05em; }
    .flt input, .flt select { background:#0f172a; border:1px solid #334155; border-radius:.5rem; padding:.45rem .6rem; font-size:.8125rem; font-weight:400; color:#e2e8f0; text-transform:none; letter-spacing:normal; outline:none; }
    .flt input:focus, .flt select:focus { border-color:#06b6d4; }
    .aba { padding:.5rem 1rem; border-radius:.5rem; border:1px solid #334155; background:#1e293b; color:#94a3b8; font-weight:600; font-size:.8125rem; }
    .aba:hover { color:#fff; }
    .aba[aria-selected="true"] { background:rgba(6,182,212,.12); color:#22d3ee; border-color:rgba(6,182,212,.4); }
    .preset.on { background:rgba(6,182,212,.15); color:#22d3ee; border-color:rgba(6,182,212,.4); }
    .bi-card { background:#1e293b; border:1px solid #334155; border-radius:.75rem; padding:1.25rem; }
    .bi-card h2 { font-size:.8rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:#94a3b8; margin-bottom:.75rem; }
    .bi-table { width:100%; font-size:.8125rem; border-collapse:collapse; }
    .bi-table th { text-align:left; color:#94a3b8; font-size:.6875rem; text-transform:uppercase; letter-spacing:.05em; padding:.4rem .6rem; }
    .bi-table td { padding:.5rem .6rem; border-top:1px solid #334155; color:#e2e8f0; }
    .bi-table tr:hover td { background:rgba(15,23,42,.5); }
</style>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="{% static 'Daedalus/Dashboard/dashboard.js' %}" defer></script>
{% endblock %}
