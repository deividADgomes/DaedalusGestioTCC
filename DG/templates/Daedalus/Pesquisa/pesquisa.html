{% extends 'Daedalus/Base.html' %}
{% load static %}

{% block title %}Daedalus Gestio - Pesquisa{% endblock %}

{% block header %}
<div>
    <h1 class="text-2xl font-bold text-white">Pesquisa</h1>
    <p class="text-xs text-cyan-500 font-medium tracking-wide uppercase mt-1">Pesquisa das Triagens Técnicas</p>
</div>
{% endblock %}

{% block content %}
<div class="flex-1 overflow-y-auto p-4 md:p-8">
    <div class="max-w-7xl mx-auto w-full flex flex-col gap-6 pb-10">

        <section class="flex flex-col md:flex-row gap-4 items-center bg-[#1e293b] p-4 rounded-xl border border-[#334155] shadow-lg shrink-0">
            <div class="relative flex-1 w-full">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input type="text" id="input-pesquisa" placeholder="Buscar por Ticket, Cliente, SN ou Analista..." 
                    class="w-full bg-[#0f172a] border border-[#334155] rounded-lg py-3 pl-12 pr-4 text-sm text-slate-200 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none transition-all placeholder:text-slate-500">
            </div>
            
            <div class="flex items-center gap-3 w-full md:w-auto bg-[#0f172a] border border-[#334155] rounded-lg px-4 py-2">
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider whitespace-nowrap">Status:</label>
                <select id="filtro-status" class="bg-transparent border-none text-sm text-slate-200 py-1 outline-none cursor-pointer w-full md:w-32">
                    <option value="todos" class="text-black">Todos</option>
                    <option value="1" class="text-black">Funcional</option>
                    <option value="2" class="text-black">Não Funcional</option>
                </select>
            </div>
        </section>

        <section id="lista-pesquisa" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            <div class="col-span-full flex flex-col items-center justify-center py-20 text-slate-600 border-2 border-dashed border-[#334155] rounded-2xl">
                <svg class="w-12 h-12 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <p class="text-sm font-medium uppercase tracking-wider">Carregando base de dados...</p>
            </div>
        </section>

    </div>
</div>
{% endblock %}

{% block extra_js %} 
<script src="{% static 'Daedalus/Pesquisa/pesquisa.js' %}" defer></script>
{% endblock %}
